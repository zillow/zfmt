name: Go

on:
  push:
    branches: [main]
    tags: ['v*', 'zfmtjson/v*', 'zfmtproto/v*', 'zfmtavro/v*', 'zfmtstring/v*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: '**/go.sum'

      # go.work pulls in every module, so one download covers the workspace.
      - name: Download Dependencies
        run: go mod download

      - name: Test
        run: make cover

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out,./zfmtjson/coverage.out,./zfmtproto/coverage.out,./zfmtavro/coverage.out,./zfmtstring/coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Check out repository
      - uses: actions/setup-go@v5
        name: Set up Go
        with:
          go-version: 1.26.x
          cache: false  # managed by golangci-lint

      - uses: golangci/golangci-lint-action@v8
        name: Install golangci-lint
        with:
          version: v2.12.2
          # Hack: Use the official action to download, but not run.
          # make lint below will handle actually running the linter.
          args: --help

      - run: make lint
        name: Lint
