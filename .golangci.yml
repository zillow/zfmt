# golangci-lint v2 configuration. Run per module via `make lint` (see MODULE_DIRS in the Makefile).
version: "2"

run:
  tests: false

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - cyclop
    - decorder
    - depguard
    - dupl
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - nolintlint
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/satori/go.uuid
              desc: Prefer "github.com/google/uuid"
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - testdata

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
  exclusions:
    generated: lax
    paths:
      - testdata
